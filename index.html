<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin: 0;
            font-size: 3em;
        }
        
        p {
            color: #666;
            margin: 20px 0 0 0;
            font-size: 1.1em;
        }
        
        .gif-container {
            margin-top: 30px;
        }
        
        .gif-container img {
            max-width: 300px;
            height: auto;
            border-radius: 8px;
        }
        
        .iframe-container {
            margin-top: 40px;
            border: 2px solid #667eea;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .iframe-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World!</h1>
        <p>Welcome to jaxpher.github.io</p>
        
        <div class="gif-container">
            <img src="https://media.giphy.com/media/3o6Zt6KHxJTbXCnSvu/giphy.gif" alt="Dancing Baby">
        </div>
        
        <div class="iframe-container">
            <iframe src="https://vdo.ninja/?room=jaxpher_github_io" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
